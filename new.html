<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="flex flex-col gap-4 w-full max-w-md mx-auto p-6 card"><div class="card p-6 w-full max-w-sm flex-col gap-4">
  <h2 class="nav-brand text-2xl text-center">Sign In</h2>
  <div class="flex-col gap-3">
    <div class="flex-col gap-1">
      <label class="text-sm">Email Address</label>
      <input type="email" class="select" placeholder="name@company.com" />
    </div>
    <div class="flex-col gap-1">
      <label class="text-sm">Password</label>
      <input type="password" class="select" placeholder="••••••••" />
    </div>
  </div>
  <div class="flex items-center gap-2">
    <input type="checkbox" class="primary" id="remember" />
    <label for="remember" class="text-sm radio-label">Remember me</label>
  </div>
  <button class="filled primary md w-full">Login to Account</button>
</div>
</div>
</body>
</html>
