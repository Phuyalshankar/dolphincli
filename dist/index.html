<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dolphincss</title>
    <script>
      // DolphinCSS Global Auto Theme Script
      (function() {
        var theme = localStorage.getItem('theme-mode') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var name = localStorage.getItem('theme-name') || 'dolphin';
        document.documentElement.setAttribute('data-theme-mode', theme);
        document.documentElement.setAttribute('data-theme', name);
      })();
    </script>
    <script type="module" crossorigin src="/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-DoMwi_0e.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
