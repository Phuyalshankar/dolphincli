  This marker activates the file-based automatic routing system.

  HOW IT WORKS:
  1. Create a  src/pages/  folder in your project
  2. Add page components:
       src/pages/index.jsx       →  /
       src/pages/about.jsx       →  /about
       src/pages/blog/index.jsx  →  /blog
       src/pages/blog/[slug].jsx →  /blog/:slug
       src/pages/_layout.jsx     →  (skipped – use as shared layout)

  3. The Vite plugin auto-generates  src/generated-router.jsx
  4. Import it in your App.jsx:

       import AppRouter from './generated-router';
       function App() { return <AppRouter />; }

  CONFIGURATION (dolphin.config.json):
  {
    "routing": {
      "enabled": true,
      "pagesDir": "src/pages",
      "outputFile": "src/generated-router.jsx",
      "lazyLoad": true,
      "basePath": "/",
      "notFoundComponent": "src/components/NotFound.jsx"
    }
  }

  Requires react-router-dom v6+ to be installed in your project.
